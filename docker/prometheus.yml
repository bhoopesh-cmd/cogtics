# Prometheus Configuration (Phase 11)
# Scrapes metrics from API and Worker services

global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  # Prometheus self-monitoring
  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']

  # OpenTelemetry Collector metrics
  - job_name: 'otel-collector'
    static_configs:
      - targets: ['otel-collector:8888']

  # Cogtics API metrics (when running locally)
  - job_name: 'cogtics-api'
    static_configs:
      - targets: ['host.docker.internal:9464']
    scrape_interval: 10s
    metrics_path: /metrics

  # Cogtics Worker metrics (when running locally)
  - job_name: 'cogtics-worker'
    static_configs:
      - targets: ['host.docker.internal:9465']
    scrape_interval: 10s
    metrics_path: /metrics

# Remote write for OTel Collector
remote_write: []
